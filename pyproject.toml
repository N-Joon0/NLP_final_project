[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dakd"
version = "0.1.0"
description = "Difficulty-Aware Knowledge Distillation experiments (SST-2 / KLUE-YNAT)"
requires-python = ">=3.10"
dependencies = [
  "torch", "transformers", "datasets", "scikit-learn", "numpy", "pandas",
  "scipy", "matplotlib", "pyyaml", "safetensors", "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
